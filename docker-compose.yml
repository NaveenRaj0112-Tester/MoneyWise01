services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"   # keeps the app's default root/empty credentials
      MYSQL_DATABASE: ${DB_NAME:-moneywise}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-moneywise}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Live-reload your local edits into the container during development.
      # Remove this bind-mount when you want the image to be self-contained.
      - .:/var/www/html

volumes:
  db_data:
