<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1c;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .calculator {
    width: 320px;
    background: #1a1a1c;
    padding: 24px 16px 20px;
    border-radius: 28px;
  }

  .display {
    text-align: right;
    padding: 20px 12px 28px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .display .previous {
    min-height: 20px;
    font-size: 14px;
    color: #6a6a72;
    font-family: 'Consolas', 'SF Mono', monospace;
  }

  .display .current {
    font-size: 52px;
    color: #e2e2e6;
    font-family: 'Consolas', 'SF Mono', monospace;
    font-weight: 300;
    line-height: 1.15;
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    border: none;
    height: 62px;
    border-radius: 14px;
    font-size: 21px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease, filter 0.1s ease;
  }

  button:active { transform: scale(0.94); }
  button:hover { filter: brightness(1.15); }

  button.num {
    background: #2a2a2e;
    color: #e2e2e6;
    font-weight: 400;
  }

  button.func {
    background: #2a2a2e;
    color: #c8c8cc;
    font-weight: 500;
    font-size: 19px;
  }

  button.op {
    background: #b87333;
    color: #ffffff;
    font-weight: 600;
    font-size: 24px;
  }

  button.span-2 {
    grid-column: span 2;
    border-radius: 14px;
    justify-content: center;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="previous" id="previous"></div>
    <div class="current" id="current">0</div>
  </div>

  <div class="keys">
    <button class="func" data-action="clear">AC</button>
    <button class="func" data-action="negate">+/−</button>
    <button class="func" data-action="percent">%</button>
    <button class="op" data-action="divide">÷</button>

    <button class="num" data-num="7">7</button>
    <button class="num" data-num="8">8</button>
    <button class="num" data-num="9">9</button>
    <button class="op" data-action="multiply">×</button>

    <button class="num" data-num="4">4</button>
    <button class="num" data-num="5">5</button>
    <button class="num" data-num="6">6</button>
    <button class="op" data-action="subtract">−</button>

    <button class="num" data-num="1">1</button>
    <button class="num" data-num="2">2</button>
    <button class="num" data-num="3">3</button>
    <button class="op" data-action="add">+</button>

    <button class="num span-2" data-num="0">0</button>
    <button class="num" data-action="decimal">.</button>
    <button class="op" data-action="equals">=</button>
  </div>
</div>

<script>
  const currentEl = document.getElementById('current');
  const previousEl = document.getElementById('previous');

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;

  function updateDisplay() {
    currentEl.textContent = current;
    previousEl.textContent = previous !== null && operator ? `${previous} ${operator}` : '';
  }

  function inputNumber(num) {
    if (overwrite) {
      current = num === '.' ? '0.' : num;
      overwrite = false;
      return;
    }
    if (num === '.' && current.includes('.')) return;
    current = current === '0' && num !== '.' ? num : current + num;
  }

  function chooseOperator(op) {
    if (operator && !overwrite) {
      compute();
    }
    previous = current;
    operator = op;
    overwrite = true;
  }

  function compute() {
    const a = parseFloat(previous);
    const b = parseFloat(current);
    if (isNaN(a) || isNaN(b)) return;

    let result;
    switch (operator) {
      case 'add': result = a + b; break;
      case 'subtract': result = a - b; break;
      case 'multiply': result = a * b; break;
      case 'divide': result = b === 0 ? NaN : a / b; break;
      default: return;
    }

    current = Number.isNaN(result) ? 'Error' : trimNumber(result);
    operator = null;
    previous = null;
    overwrite = true;
  }

  function trimNumber(num) {
    return parseFloat(num.toFixed(10)).toString();
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
  }

  function negate() {
    if (current === '0' || current === 'Error') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
  }

  function percent() {
    if (current === 'Error') return;
    current = trimNumber(parseFloat(current) / 100);
  }

  document.querySelectorAll('[data-num]').forEach(btn => {
    btn.addEventListener('click', () => {
      inputNumber(btn.dataset.num);
      updateDisplay();
    });
  });

  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      switch (action) {
        case 'clear': clearAll(); break;
        case 'negate': negate(); break;
        case 'percent': percent(); break;
        case 'decimal': inputNumber('.'); break;
        case 'equals': compute(); break;
        case 'add':
        case 'subtract':
        case 'multiply':
        case 'divide':
          chooseOperator(action);
          break;
      }
      updateDisplay();
    });
  });

  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
    else if (e.key === '.') inputNumber('.');
    else if (e.key === '+') chooseOperator('add');
    else if (e.key === '-') chooseOperator('subtract');
    else if (e.key === '*') chooseOperator('multiply');
    else if (e.key === '/') { e.preventDefault(); chooseOperator('divide'); }
    else if (e.key === 'Enter' || e.key === '=') compute();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') {
      current = current.length > 1 ? current.slice(0, -1) : '0';
      overwrite = false;
    }
    updateDisplay();
  });

  updateDisplay();
</script>

</body>
</html>
